<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: bold; fill: #111; }
    .sub   { font-size: 12px; fill: #555; }
    .subtitle { font-size: 13px; font-weight: bold; fill: #111; }
    .lab   { font-size: 11px; fill: #111; }
    .pin   { font-size: 9.5px; fill: #111; }
    .small { font-size: 9px; fill: #555; }
    .tiny  { font-size: 8px; fill: #555; }
    .note  { font-size: 10px; fill: #444; font-style: italic; }
    .rowlt { font-size: 10px; fill: #888; }
    .colnum{ font-size: 9px; fill: #888; }
    .pwr  { stroke: #c0392b; stroke-width: 2.2; fill: none; }
    .gnd  { stroke: #111;    stroke-width: 2.2; fill: none; }
    .data { stroke: #2563eb; stroke-width: 2;   fill: none; }
    .analog { stroke: #15803d; stroke-width: 2; fill: none; }
    .grid { stroke: #e4e4e4; stroke-width: 1; }
    .comp { fill: #fafafa; stroke: #111; stroke-width: 1.4; }
    .esp  { fill: #d9d9d9; stroke: #333; stroke-width: 1.6; }
    .opt  { fill: none; stroke: #999; stroke-width: 1.2; stroke-dasharray: 5,3; }
    .j    { fill: #111; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" class="title">Control-Box Protoboard — Half-Size, Direct-Drive</text>
  <text x="450" y="46" text-anchor="middle" class="sub">half-size Perma-Proto (30 cols) · piezo networks at the discs (§4.3) · no on-board resistors, no level shifter, no JSTs · pigtails solder direct</text>

  <!-- piezo signal entries, top (6): S8 c8, S7 c11, S6 c16, S5 c17, S4 c18, S3 c19 -->
  <text x="211" y="78" text-anchor="middle" class="tiny" fill="#15803d">S8·G9</text>
  <text x="265" y="78" text-anchor="middle" class="tiny" fill="#15803d">S7·G8</text>
  <text x="355" y="64" text-anchor="middle" class="tiny" fill="#15803d">S6·G7</text>
  <text x="373" y="78" text-anchor="middle" class="tiny" fill="#15803d">S5·G6</text>
  <text x="391" y="64" text-anchor="middle" class="tiny" fill="#15803d">S4·G5</text>
  <text x="409" y="78" text-anchor="middle" class="tiny" fill="#15803d">S3·G4</text>
  <g>
    <polyline points="211,84 211,168" class="analog" marker-end="url(#arr)"/>
    <polyline points="265,84 265,168" class="analog" marker-end="url(#arr)"/>
    <polyline points="355,70 355,168" class="analog" marker-end="url(#arr)"/>
    <polyline points="373,84 373,168" class="analog" marker-end="url(#arr)"/>
    <polyline points="391,70 391,168" class="analog" marker-end="url(#arr)"/>
    <polyline points="409,84 409,168" class="analog" marker-end="url(#arr)"/>
  </g>
  <!-- example GND returns, top -->
  <line x1="238" y1="90" x2="238" y2="132" class="gnd"/><circle cx="238" cy="132" r="2.6" class="j"/>
  <line x1="427" y1="90" x2="427" y2="132" class="gnd"/><circle cx="427" cy="132" r="2.6" class="j"/>
  <text x="150" y="112" class="tiny" fill="#15803d">piezo signal leads land in the free row-a/j hole of each GPIO column · GND leads → nearest rail</text>

  <!-- ===================== POWER RAILS ===================== -->
  <text x="34" y="120" class="small" fill="#c0392b">+5V</text>
  <line x1="70" y1="116" x2="616" y2="116" stroke="#c0392b" stroke-width="2.2"/>
  <text x="34" y="136" class="small">GND</text>
  <line x1="70" y1="132" x2="616" y2="132" stroke="#111" stroke-width="2.2"/>

  <text x="34" y="396" class="small" fill="#c0392b">+5V</text>
  <line x1="70" y1="400" x2="616" y2="400" stroke="#c0392b" stroke-width="2.2"/>
  <text x="34" y="412" class="small">GND</text>
  <line x1="70" y1="416" x2="616" y2="416" stroke="#111" stroke-width="2.2"/>

  <!-- rail bridge jumpers routed around the LEFT board edge (socket occupies col 1) -->
  <polyline points="70,116 52,116 52,400 70,400" class="pwr"/>
  <polyline points="70,132 60,132 60,416 70,416" class="gnd"/>
  <circle cx="70" cy="116" r="2.6" class="j"/><circle cx="70" cy="400" r="2.6" class="j"/>
  <circle cx="70" cy="132" r="2.6" class="j"/><circle cx="70" cy="416" r="2.6" class="j"/>

  <!-- power pigtail entry (bottom-left) -->
  <line x1="28" y1="452" x2="82" y2="452" class="pwr"/>
  <polyline points="82,452 82,400" class="pwr"/>
  <line x1="28" y1="466" x2="94" y2="466" class="gnd"/>
  <polyline points="94,466 94,416" class="gnd"/>
  <circle cx="82" cy="400" r="2.6" class="j"/><circle cx="94" cy="416" r="2.6" class="j"/>
  <text x="28" y="484" class="pin">5V/GND pigtail (≥20 AWG) → WAGO 221 node on the slab DC rail</text>

  <!-- 1000 µF across bottom rails -->
  <line x1="150" y1="400" x2="150" y2="405" class="pwr"/>
  <line x1="138" y1="405" x2="162" y2="405" stroke="#c0392b" stroke-width="2.4"/>
  <line x1="142" y1="410" x2="158" y2="410" stroke="#111" stroke-width="2"/>
  <line x1="150" y1="410" x2="150" y2="416" class="gnd"/>
  <circle cx="150" cy="400" r="2.6" class="j"/><circle cx="150" cy="416" r="2.6" class="j"/>
  <text x="168" y="411" class="pin">1000 µF (+ to 5V)</text>

  <!-- ===================== BOARD BODY ===================== -->
  <rect x="70" y="150" width="546" height="220" rx="5" fill="#f7f7f4" stroke="#ccc" stroke-width="1"/>
  <rect x="70" y="251" width="546" height="18" fill="#e9e9e9"/>
  <line x1="70" y1="260" x2="616" y2="260" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- row letters -->
  <text x="622" y="171" class="rowlt">a</text>
  <text x="622" y="189" class="rowlt">b</text>
  <text x="622" y="207" class="rowlt">c</text>
  <text x="622" y="225" class="rowlt">d</text>
  <text x="622" y="243" class="rowlt">e</text>
  <text x="622" y="283" class="rowlt">f</text>
  <text x="622" y="301" class="rowlt">g</text>
  <text x="622" y="319" class="rowlt">h</text>
  <text x="622" y="337" class="rowlt">i</text>
  <text x="622" y="355" class="rowlt">j</text>

  <!-- column guides every 5th -->
  <g>
    <line x1="85"  y1="158" x2="85"  y2="362" class="grid"/><text x="85"  y="147" text-anchor="middle" class="colnum">1</text>
    <line x1="157" y1="158" x2="157" y2="362" class="grid"/><text x="157" y="147" text-anchor="middle" class="colnum">5</text>
    <line x1="247" y1="158" x2="247" y2="362" class="grid"/><text x="247" y="147" text-anchor="middle" class="colnum">10</text>
    <line x1="337" y1="158" x2="337" y2="362" class="grid"/><text x="337" y="147" text-anchor="middle" class="colnum">15</text>
    <line x1="427" y1="158" x2="427" y2="362" class="grid"/><text x="427" y="147" text-anchor="middle" class="colnum">20</text>
    <line x1="517" y1="158" x2="517" y2="362" class="grid"/><text x="517" y="147" text-anchor="middle" class="colnum">25</text>
    <line x1="607" y1="158" x2="607" y2="362" class="grid"/><text x="607" y="147" text-anchor="middle" class="colnum">30</text>
  </g>

  <!-- ===================== ESP32-S3 ===================== -->
  <rect x="76" y="158" width="396" height="204" rx="6" class="esp"/>
  <text x="274" y="232" text-anchor="middle" class="subtitle" fill="#222">ESP32-S3  DevKitC-1</text>
  <text x="274" y="250" text-anchor="middle" class="small" fill="#444">on two 1×22 female headers — pins in rows b &amp; i, cols 1–22</text>
  <text x="274" y="266" text-anchor="middle" class="small" fill="#444">◀ both USB ports face this edge (enclosure service side)</text>
  <text x="274" y="282" text-anchor="middle" class="small" fill="#444">pin map = v1.1 silkscreen (USB left), same as protoboard_wiring.svg</text>
  <text x="100" y="178" class="small" fill="#333">col 1 (row a): GND → GND rail · col 2: 5V → +5V rail</text>
  <text x="100" y="192" class="small" fill="#2563eb">col 6 (row a): GPIO 11 (data out) ↑</text>

  <!-- ESP GND col1 / 5V col2 → top rails -->
  <line x1="85" y1="158" x2="85" y2="132" class="gnd"/>
  <circle cx="85" cy="132" r="2.6" class="j"/>
  <line x1="103" y1="158" x2="103" y2="116" class="pwr"/>
  <circle cx="103" cy="116" r="2.6" class="j"/>

  <!-- DATA path: GPIO 11 (col 6 row a) → 470 Ω in-line → strip DATA harness (direct, no shifter) -->
  <polyline points="175,168 175,142 630,142 630,344 660,344" class="data" marker-end="url(#arr)"/>
  <rect x="360" y="136" width="26" height="12" class="comp"/>
  <text x="373" y="130" text-anchor="middle" class="pin">470 Ω in-line (heat-shrunk)</text>
  <circle cx="175" cy="168" r="2.6" class="j"/>
  <text x="640" y="336" class="pin" fill="#2563eb">DATA</text>

  <!-- optional level-shifter callout: where the '125 goes if pixel 1 ever glitches -->
  <rect x="470" y="196" width="126" height="52" rx="4" class="opt"/>
  <text x="533" y="214" text-anchor="middle" class="tiny" fill="#666">OPTIONAL: 74AHCT125</text>
  <text x="533" y="226" text-anchor="middle" class="tiny" fill="#666">splices into the data run</text>
  <text x="533" y="238" text-anchor="middle" class="tiny" fill="#666">(GPIO11→'125→470→DIN)</text>
  <line x1="470" y1="222" x2="386" y2="142" class="opt"/>

  <!-- strip 5V / GND from bottom-rail right ends -->
  <polyline points="616,400 660,400" class="pwr" marker-end="url(#arr)"/>
  <polyline points="616,416 660,416" class="gnd" marker-end="url(#arr)"/>
  <circle cx="616" cy="400" r="2.6" class="j"/><circle cx="616" cy="416" r="2.6" class="j"/>
  <text x="668" y="403" class="pin" fill="#c0392b">5V</text>
  <text x="668" y="419" class="pin">GND</text>
  <text x="700" y="356" class="pin">3-wire strip harness</text>
  <text x="700" y="370" class="pin">(DATA·5V·GND) — in-line</text>
  <text x="700" y="384" class="pin">JST-XH 3-pin a few inches</text>
  <text x="700" y="398" class="pin">off-board (service</text>
  <text x="700" y="412" class="pin">disconnect) → strip DIN</text>

  <!-- piezo signal entries, bottom (2): S2 c18, S1 c19 -->
  <g>
    <polyline points="391,446 391,352" class="analog" marker-end="url(#arr)"/>
    <polyline points="409,460 409,352" class="analog" marker-end="url(#arr)"/>
  </g>
  <line x1="373" y1="446" x2="373" y2="416" class="gnd"/><circle cx="373" cy="416" r="2.6" class="j"/>
  <text x="391" y="458" text-anchor="middle" class="tiny" fill="#15803d">S2·G2</text>
  <text x="409" y="472" text-anchor="middle" class="tiny" fill="#15803d">S1·G1</text>

  <!-- legend -->
  <g transform="translate(70,506)">
    <line x1="0" y1="0" x2="20" y2="0" class="pwr"/>      <text x="26" y="4" class="small">+5 V</text>
    <line x1="70" y1="0" x2="90" y2="0" class="gnd"/>     <text x="96" y="4" class="small">GND</text>
    <line x1="150" y1="0" x2="170" y2="0" class="data"/>  <text x="176" y="4" class="small">LED data</text>
    <line x1="245" y1="0" x2="265" y2="0" class="analog"/><text x="271" y="4" class="small">piezo signal (S#·G# = side · GPIO)</text>
    <line x1="475" y1="0" x2="495" y2="0" class="opt"/>   <text x="501" y="4" class="small">optional add-back</text>
    <circle cx="600" cy="0" r="2.6" class="j"/>           <text x="608" y="4" class="small">● = solder joint</text>
  </g>

  <!-- ===================== NOTES ===================== -->
  <text x="70" y="530" class="note">Board: half-size Perma-Proto (Adafruit 571 — 81×46 mm, 30 cols). The ESP32 socket fills cols 1–22; cols 23–30 are</text>
  <text x="70" y="544" class="note">spare. Only three things live on the board: the socket, the 1000 µF cap, and the GPIO 11 → 470 Ω → strip data run.</text>
  <text x="70" y="562" class="note">Piezos: each disc carries its own 1 MΩ + Zener (§4.3). The two-wire pigtails solder directly into the row-a/j holes —</text>
  <text x="70" y="576" class="note">signal to the GPIO column, GND to the nearest rail. No on-board resistors, no piezo JSTs. Label every pair S1–S8.</text>
  <text x="70" y="594" class="note">LED data: direct 3.3 V drive — GPIO 11 → 470 Ω (in-line, near DIN) → strip. No level shifter. 3.3 V is just under the</text>
  <text x="70" y="608" class="note">WS2812B's ~3.5 V high threshold, so the FIRST pixel is the only one at risk; if it ever glitches, add the optional</text>
  <text x="70" y="622" class="note">74AHCT125 into the data run (dashed box) — GPIO 11 → '125 → 470 Ω → DIN, VCC to 5V, 1OE to GND. See design doc §3.</text>
  <text x="70" y="640" class="note">Strip-start share (≤ ~2 A) flows through the pigtail + rails: ≥20 AWG. One common GND for ESP32, strip, and all 8 piezos.</text>
  <text x="70" y="654" class="note">Enclosure: the 81 mm board fits a ~112×62×31 mm box (e.g. Hammond 1591B). USB + PSU 5V may coexist, but unplug the</text>
  <text x="70" y="668" class="note">strip harness when flashing on USB-only power.</text>
  <text x="70" y="686" class="note">Solder female headers LAST with the DevKit seated as a jig (never solder the module itself).</text>
</svg>
